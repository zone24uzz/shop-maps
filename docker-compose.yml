# MongoDB for local development.
#
#   docker compose up -d      start (data persists in the `mongo_data` volume)
#   docker compose down       stop, keep data
#   docker compose down -v    stop and DELETE the data volume
#
# Optional: without Docker, `npm run dev` starts an embedded mongod instead.
# Keep the image version in line with backend/scripts/mongoBinary.js.

services:
  mongo:
    image: mongo:8.2
    container_name: logistics-map-mongo
    restart: unless-stopped
    ports:
      # Bound to localhost only: this development database has no authentication.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
